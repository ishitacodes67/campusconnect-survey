<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CampusConnect — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0d0f14;--surface:#151820;--surface2:#1c2030;--border:#252a3a;--accent:#4fffb0;--accent2:#7b8fff;--danger:#ff6b6b;--warn:#ffd166;--text:#e8eaf2;--muted:#6b7280;--radius:12px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}
.screen{display:none}
#loginScreen{min-height:100vh;display:none;align-items:center;justify-content:center;padding:24px}
#loginScreen.active{display:flex}
#dashScreen{display:none}
#dashScreen.active{display:block}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:48px 40px;width:100%;max-width:400px}
.login-logo{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--accent);margin-bottom:8px}
.login-sub{color:var(--muted);font-size:14px;margin-bottom:36px}
.field-label{font-size:12px;font-weight:500;color:var(--muted);margin-bottom:8px;display:block;text-transform:uppercase;letter-spacing:.05em}
.field-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:13px 16px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:border-color .2s}
.field-input:focus{border-color:rgba(79,255,176,.4)}
.login-btn{width:100%;margin-top:20px;background:var(--accent);color:#0d0f14;font-family:'Syne',sans-serif;font-size:14px;font-weight:700;padding:14px;border:none;border-radius:10px;cursor:pointer;transition:all .2s}
.login-btn:hover{background:#5fffc0}
.login-btn:disabled{opacity:.5;cursor:not-allowed}
.login-err{color:var(--danger);font-size:13px;margin-top:12px;text-align:center;min-height:20px}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar-logo{font-family:'Syne',sans-serif;font-weight:800;font-size:17px;color:var(--accent)}
.topbar-right{display:flex;align-items:center;gap:12px}
.badge-live{background:rgba(79,255,176,.1);border:1px solid rgba(79,255,176,.25);color:var(--accent);font-size:11px;font-weight:700;padding:4px 10px;border-radius:100px;letter-spacing:.08em}
.btn{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;padding:8px 16px;border-radius:8px;cursor:pointer;border:none;transition:all .2s;text-decoration:none;display:inline-flex;align-items:center}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--accent2);color:var(--text)}
.main{padding:32px;max-width:1400px;margin:0 auto}
.page-title{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;margin-bottom:4px}
.page-sub{color:var(--muted);font-size:14px;margin-bottom:32px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:32px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px}
.stat-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:10px}
.stat-value{font-family:'Syne',sans-serif;font-size:32px;font-weight:800;line-height:1}
.stat-value.green{color:var(--accent)}
.stat-value.blue{color:var(--accent2)}
.stat-value.yellow{color:var(--warn)}
.stat-sub{font-size:12px;color:var(--muted);margin-top:6px}
.tabs{display:flex;gap:4px;margin-bottom:28px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:4px;width:fit-content}
.tab{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;padding:8px 18px;border-radius:7px;cursor:pointer;border:none;background:transparent;color:var(--muted);letter-spacing:.04em;transition:all .2s}
.tab.active{background:var(--accent);color:#0d0f14}
.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px;margin-bottom:32px}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px}
.chart-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:20px}
.chart-card canvas{max-height:220px}
.chart-full{grid-column:1/-1}
.filters{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.filter-select{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;cursor:pointer}
.filter-select option{background:var(--surface2)}
.results-count{margin-left:auto;font-size:13px;color:var(--muted)}
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead{background:var(--surface2)}
th{padding:12px 16px;text-align:left;font-family:'Syne',sans-serif;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;border-bottom:1px solid var(--border)}
td{padding:14px 16px;border-bottom:1px solid rgba(37,42,58,.6);vertical-align:top}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.015)}
.tag{display:inline-block;background:rgba(79,255,176,.08);color:var(--accent);font-size:11px;padding:2px 8px;border-radius:100px;margin:2px}
.score-pill{font-family:'Syne',sans-serif;font-weight:700;font-size:13px;padding:3px 10px;border-radius:100px}
.score-high{background:rgba(79,255,176,.1);color:var(--accent)}
.score-mid{background:rgba(255,209,102,.1);color:var(--warn)}
.score-low{background:rgba(255,107,107,.1);color:var(--danger)}
.expand-btn{background:none;border:none;color:var(--accent2);cursor:pointer;font-size:12px;padding:0;font-family:'DM Sans',sans-serif}
.expand-btn:hover{text-decoration:underline}
.text-preview{max-width:260px;color:var(--muted);font-size:12px;line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.delete-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:4px;border-radius:6px;transition:all .2s}
.delete-btn:hover{color:var(--danger);background:rgba(255,107,107,.1)}
.pagination{display:flex;align-items:center;gap:8px;margin-top:20px;justify-content:center}
.page-btn{background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:'Syne',sans-serif;font-size:12px;font-weight:700;padding:7px 13px;border-radius:8px;cursor:pointer;transition:all .2s}
.page-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.page-btn.current{background:var(--accent);color:#0d0f14;border-color:var(--accent)}
.page-btn:disabled{opacity:.3;cursor:not-allowed}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(4px)}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:32px;max-width:640px;width:100%;max-height:85vh;overflow-y:auto}
.modal-title{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;margin-bottom:4px}
.modal-sub{color:var(--muted);font-size:13px;margin-bottom:28px}
.modal-row{display:grid;grid-template-columns:160px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.modal-row:last-of-type{border-bottom:none}
.modal-key{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.modal-val{font-size:14px;line-height:1.6}
.modal-close{float:right;background:var(--surface2);border:1px solid var(--border);color:var(--muted);font-size:18px;width:32px;height:32px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.empty{text-align:center;padding:64px 24px;color:var(--muted)}
.empty-icon{font-size:40px;margin-bottom:16px}
.empty-title{font-family:'Syne',sans-serif;font-size:17px;font-weight:700;margin-bottom:8px;color:var(--text)}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:60px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;right:24px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 20px;font-size:13px;z-index:999;transform:translateY(80px);opacity:0;transition:all .3s}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{border-color:rgba(79,255,176,.4);color:var(--accent)}
.toast.error{border-color:rgba(255,107,107,.4);color:var(--danger)}
@media(max-width:600px){.main{padding:16px}.charts-grid{grid-template-columns:1fr}.modal-row{grid-template-columns:1fr}.topbar{padding:0 16px}}
</style>
</head>
<body>
<div id="loginScreen" class="screen active">
  <div class="login-box">
    <div class="login-logo">◆ CampusConnect</div>
    <div class="login-sub">Survey Response Dashboard</div>
    <label class="field-label" for="pwInput">Dashboard Password</label>
    <input class="field-input" type="password" id="pwInput" placeholder="Enter shared password" autocomplete="current-password"/>
    <button class="login-btn" id="loginBtn" onclick="doLogin()">Access Dashboard →</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<div id="dashScreen" class="screen">
  <div class="topbar">
    <div class="topbar-logo">◆ CampusConnect Dashboard</div>
    <div class="topbar-right">
      <span class="badge-live" id="liveCount">— responses</span>
      <a class="btn btn-ghost" href="/share" target="_blank">🔗 Share Survey</a>
      <button class="btn btn-ghost" onclick="exportCSV()">⬇ Export CSV</button>
      <button class="btn btn-ghost" onclick="doLogout()">Logout</button>
    </div>
  </div>
  <div class="main">
    <div class="page-title">Survey Responses</div>
    <div class="page-sub" id="lastRefreshed">Loading...</div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Total Responses</div><div class="stat-value green" id="s-total">—</div></div>
      <div class="stat-card"><div class="stat-label">Today</div><div class="stat-value blue" id="s-today">—</div></div>
      <div class="stat-card"><div class="stat-label">Avg Comm Score</div><div class="stat-value yellow" id="s-comm">—</div><div class="stat-sub">out of 5</div></div>
      <div class="stat-card"><div class="stat-label">Likely to Use</div><div class="stat-value green" id="s-likely">—</div><div class="stat-sub">avg out of 5</div></div>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('analytics')">📊 Analytics</button>
      <button class="tab" onclick="switchTab('responses')">📋 All Responses</button>
    </div>
    <div id="analyticsTab"><div class="charts-grid" id="chartsGrid"><div class="spinner"></div></div></div>
    <div id="responsesTab" style="display:none">
      <div class="filters">
        <select class="filter-select" id="filterDept" onchange="loadResponses(1)">
          <option value="">All Departments</option>
          <option>Computer Science (CSE)</option>
          <option>Computer Science &amp; Design (CSD)</option>
          <option>AI &amp; Data Science (AIDS)</option>
          <option>Electronics &amp; Communication (ECE)</option>
          <option>Mechanical Engineering</option>
          <option>Civil Engineering</option>
          <option>Polytechnic</option>
          <option>Nursing</option>
          <option>MBA / Management</option>
          <option>Other</option>
        </select>
        <select class="filter-select" id="filterRole" onchange="loadResponses(1)">
          <option value="">All Roles</option>
          <option>Student</option>
          <option>Faculty</option>
        </select>
        <button class="btn btn-ghost" onclick="loadResponses(1)">↺ Refresh</button>
        <span class="results-count" id="resultsCount"></span>
      </div>
      <div id="tableContainer"><div class="spinner"></div></div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modalContent"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const API = '';
let TOKEN = localStorage.getItem('cc_token') || '';
let currentPage = 1;
let chartInstances = {};

async function doLogin() {
  const pw = document.getElementById('pwInput').value.trim();
  const err = document.getElementById('loginErr');
  const btn = document.getElementById('loginBtn');
  if (!pw) { err.textContent = 'Enter the dashboard password.'; return; }
  btn.disabled = true; btn.textContent = 'Verifying...'; err.textContent = '';
  try {
    const res = await fetch(`${API}/api/dashboard/login`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ password: pw })
    });
    const data = await res.json();
    if (!res.ok) { err.textContent = data.detail || 'Incorrect password.'; return; }
    TOKEN = data.access_token;
    localStorage.setItem('cc_token', TOKEN);
    showDashboard();
  } catch(e) {
    err.textContent = 'Cannot connect to backend.';
  } finally {
    btn.disabled = false; btn.textContent = 'Access Dashboard →';
  }
}

document.getElementById('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

function doLogout() {
  localStorage.removeItem('cc_token'); TOKEN = '';
  document.getElementById('dashScreen').classList.remove('active');
  document.getElementById('loginScreen').classList.add('active');
  document.getElementById('pwInput').value = '';
}

async function api(path, opts = {}) {
  const res = await fetch(`${API}${path}`, {
    ...opts, headers: { 'Authorization': `Bearer ${TOKEN}`, 'Content-Type': 'application/json', ...(opts.headers || {}) }
  });
  if (res.status === 401) { doLogout(); throw new Error('Session expired'); }
  if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.detail || `HTTP ${res.status}`); }
  return res;
}

async function showDashboard() {
  document.getElementById('loginScreen').classList.remove('active');
  document.getElementById('dashScreen').classList.add('active');
  await Promise.all([loadStats(), loadResponses(1)]);
}

if (TOKEN) { showDashboard().catch(() => { TOKEN = ''; localStorage.removeItem('cc_token'); }); }

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', ['analytics','responses'][i] === tab));
  document.getElementById('analyticsTab').style.display  = tab === 'analytics' ? 'block' : 'none';
  document.getElementById('responsesTab').style.display  = tab === 'responses'  ? 'block' : 'none';
}

const PALETTE = ['rgba(79,255,176,.75)','rgba(123,143,255,.75)','rgba(255,209,102,.75)','rgba(255,107,107,.75)','rgba(99,226,255,.75)','rgba(255,150,100,.75)','rgba(180,120,255,.75)','rgba(80,200,150,.75)','rgba(255,180,80,.75)','rgba(100,180,255,.75)'];

function destroyChart(id) { if (chartInstances[id]) { chartInstances[id].destroy(); delete chartInstances[id]; } }

function makeBarChart(id, labels, values, color='rgba(79,255,176,.8)') {
  destroyChart(id);
  const ctx = document.getElementById(id);
  if (!ctx) return;
  chartInstances[id] = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: [{ data: values, backgroundColor: color, borderRadius: 6, borderSkipped: false }] },
    options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { display: false } },
      scales: { x: { ticks: { color: '#6b7280', font: { size: 11 } }, grid: { color: 'rgba(255,255,255,.04)' } },
                y: { ticks: { color: '#6b7280', font: { size: 11 }, stepSize: 1 }, grid: { color: 'rgba(255,255,255,.06)' } } } }
  });
}

function makeDoughnut(id, labels, values) {
  destroyChart(id);
  const ctx = document.getElementById(id);
  if (!ctx) return;
  chartInstances[id] = new Chart(ctx, {
    type: 'doughnut',
    data: { labels, datasets: [{ data: values, backgroundColor: PALETTE, borderColor: '#151820', borderWidth: 3 }] },
    options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'bottom', labels: { color: '#6b7280', font: { size: 11 }, padding: 14, boxWidth: 12 } } }, cutout: '62%' }
  });
}

function makeLineChart(id, labels, values) {
  destroyChart(id);
  const ctx = document.getElementById(id);
  if (!ctx) return;
  chartInstances[id] = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets: [{ data: values, borderColor: 'rgba(79,255,176,.8)', backgroundColor: 'rgba(79,255,176,.08)', fill: true, tension: 0.4, pointRadius: 4, pointBackgroundColor: 'rgba(79,255,176,.8)' }] },
    options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { display: false } },
      scales: { x: { ticks: { color: '#6b7280', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,.04)' } },
                y: { ticks: { color: '#6b7280', font: { size: 11 }, stepSize: 1 }, grid: { color: 'rgba(255,255,255,.06)' } } } }
  });
}

async function loadStats() {
  try {
    const res  = await api('/api/dashboard/stats');
    const data = await res.json();
    document.getElementById('s-total').textContent  = data.total;
    document.getElementById('s-today').textContent  = data.today;
    document.getElementById('s-comm').textContent   = data.avg_comm_score || '—';
    document.getElementById('s-likely').textContent = data.avg_likely_score || '—';
    document.getElementById('liveCount').textContent = `${data.total} responses`;
    document.getElementById('lastRefreshed').textContent = 'Last refreshed: ' + new Date().toLocaleTimeString();
    renderCharts(data.charts || {});
  } catch(e) { showToast('Failed to load stats: ' + e.message, 'error'); }
}

function renderCharts(c) {
  const grid = document.getElementById('chartsGrid');
  if (!Object.keys(c).length) {
    grid.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><div class="empty-title">No data yet</div><p>Responses will appear here once students submit the survey.</p></div>';
    return;
  }
  const sorted = obj => { const e = Object.entries(obj||{}).sort((a,b)=>b[1]-a[1]); return {labels:e.map(x=>x[0]),values:e.map(x=>x[1])}; };
  grid.innerHTML = `
    <div class="chart-card chart-full"><div class="chart-title">Submissions Over Time</div><canvas id="c-daily"></canvas></div>
    <div class="chart-card"><div class="chart-title">Role Distribution</div><canvas id="c-role"></canvas></div>
    <div class="chart-card"><div class="chart-title">By Department</div><canvas id="c-dept"></canvas></div>
    <div class="chart-card"><div class="chart-title">By Year</div><canvas id="c-year"></canvas></div>
    <div class="chart-card"><div class="chart-title">Missed Events?</div><canvas id="c-missed"></canvas></div>
    <div class="chart-card"><div class="chart-title">AI Personalised Feed — Want it?</div><canvas id="c-aireco"></canvas></div>
    <div class="chart-card"><div class="chart-title">Privacy Comfort</div><canvas id="c-privacy"></canvas></div>
    <div class="chart-card"><div class="chart-title">Notification Frequency</div><canvas id="c-notiffreq"></canvas></div>
    <div class="chart-card"><div class="chart-title">How Students Find Events</div><canvas id="c-discover"></canvas></div>
    <div class="chart-card"><div class="chart-title">Top Interests</div><canvas id="c-interests"></canvas></div>
    <div class="chart-card"><div class="chart-title">Preferred Notification Channels</div><canvas id="c-notif"></canvas></div>
    <div class="chart-card"><div class="chart-title">Most Wanted Features</div><canvas id="c-features"></canvas></div>
  `;
  const daily = Object.entries(c.daily_submissions||{}).sort((a,b)=>a[0]>b[0]?1:-1);
  makeLineChart('c-daily', daily.map(e=>e[0].slice(5)), daily.map(e=>e[1]));
  const role=sorted(c.by_role); makeDoughnut('c-role',role.labels,role.values);
  const dept=sorted(c.by_dept); makeBarChart('c-dept',dept.labels,dept.values,'rgba(123,143,255,.8)');
  const year=sorted(c.by_year); makeBarChart('c-year',year.labels,year.values,'rgba(255,209,102,.8)');
  const miss=sorted(c.missed);  makeDoughnut('c-missed',miss.labels,miss.values);
  const air=sorted(c.ai_reco);  makeDoughnut('c-aireco',air.labels,air.values);
  const priv=sorted(c.privacy); makeDoughnut('c-privacy',priv.labels,priv.values);
  const nf=sorted(c.notif_freq);makeBarChart('c-notiffreq',nf.labels,nf.values,'rgba(79,255,176,.8)');
  const disc=sorted(c.discover);makeBarChart('c-discover',disc.labels,disc.values,'rgba(123,143,255,.8)');
  const int_=sorted(c.interests);makeBarChart('c-interests',int_.labels,int_.values,'rgba(79,255,176,.8)');
  const not_=sorted(c.notif);   makeBarChart('c-notif',not_.labels,not_.values,'rgba(255,209,102,.8)');
  const feat=sorted(c.features);makeBarChart('c-features',feat.labels,feat.values,'rgba(79,255,176,.8)');
}

async function loadResponses(page=1) {
  currentPage = page;
  const dept = document.getElementById('filterDept')?.value||'';
  const role = document.getElementById('filterRole')?.value||'';
  const container = document.getElementById('tableContainer');
  container.innerHTML = '<div class="spinner"></div>';
  try {
    const params = new URLSearchParams({page, limit:20});
    if (dept) params.set('dept',dept);
    if (role) params.set('role',role);
    const res  = await api(`/api/dashboard/responses?${params}`);
    const data = await res.json();
    document.getElementById('resultsCount').textContent = `${data.total} response${data.total!==1?'s':''}`;
    if (!data.total) {
      container.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><div class="empty-title">No responses yet</div><p>Share the survey link and responses will appear here.</p></div>';
      document.getElementById('pagination').innerHTML = '';
      return;
    }
    container.innerHTML = `<div class="table-wrap"><div class="table-scroll"><table>
      <thead><tr><th>#</th><th>Date</th><th>Role</th><th>Dept</th><th>Year</th><th>Comm ★</th><th>Likely ★</th><th>AI Reco</th><th>Missed</th><th>Biggest Problem</th><th></th></tr></thead>
      <tbody id="tbody"></tbody></table></div></div>`;
    const tbody = document.getElementById('tbody');
    data.data.forEach(r => {
      const sc = v => v>=4?'score-high':v===3?'score-mid':'score-low';
      const date = new Date(r.submitted_at).toLocaleDateString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td style="color:var(--muted);font-size:12px">${r.id}</td>
        <td style="font-size:12px;color:var(--muted);white-space:nowrap">${date}</td>
        <td><span class="tag">${r.role}</span></td>
        <td style="font-size:12px;max-width:120px">${r.dept}</td>
        <td style="font-size:12px;white-space:nowrap">${r.year}</td>
        <td><span class="score-pill ${sc(r.comm_score)}">${r.comm_score}/5</span></td>
        <td><span class="score-pill ${sc(r.likely_score)}">${r.likely_score}/5</span></td>
        <td style="font-size:12px;max-width:140px">${r.ai_reco||''}</td>
        <td style="font-size:12px">${r.missed||''}</td>
        <td><div class="text-preview">${escHtml(r.biggest_problem)}</div></td>
        <td style="display:flex;gap:8px;align-items:center">
          <button class="expand-btn" onclick="openModal(${r.id})">View all</button>
          <button class="delete-btn" onclick="deleteResponse(${r.id})" title="Delete">✕</button>
        </td>`;
      tbody.appendChild(tr);
    });
    window._responses = data.data;
    renderPagination(data.page, data.pages);
  } catch(e) {
    container.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-title">Failed to load</div><p>${escHtml(e.message)}</p></div>`;
  }
}

function renderPagination(page, pages) {
  const el = document.getElementById('pagination');
  if (pages<=1) { el.innerHTML=''; return; }
  let html = `<button class="page-btn" onclick="loadResponses(${page-1})" ${page===1?'disabled':''}>←</button>`;
  for (let p=Math.max(1,page-2);p<=Math.min(pages,page+2);p++)
    html += `<button class="page-btn ${p===page?'current':''}" onclick="loadResponses(${p})">${p}</button>`;
  html += `<button class="page-btn" onclick="loadResponses(${page+1})" ${page===pages?'disabled':''}>→</button>`;
  html += `<span style="font-size:13px;color:var(--muted)">Page ${page} of ${pages}</span>`;
  el.innerHTML = html;
}

function openModal(id) {
  const r = (window._responses||[]).find(x=>x.id===id);
  if (!r) return;
  const date = new Date(r.submitted_at).toLocaleString('en-IN');
  const tags = arr => (Array.isArray(arr)?arr:[]).map(v=>`<span class="tag">${escHtml(v)}</span>`).join('')||'—';
  document.getElementById('modalContent').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:20px">
      <div><div class="modal-title">Response #${r.id}</div><div class="modal-sub">Submitted ${date}</div></div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    ${mrow('Role',`<span class="tag">${escHtml(r.role)}</span>`)}
    ${mrow('Department',escHtml(r.dept))}
    ${mrow('Year',escHtml(r.year))}
    ${mrow('Discovers via',tags(r.discover))}
    ${mrow('Missed events?',escHtml(r.missed))}
    ${mrow('Comm. score',`<span class="score-pill ${r.comm_score>=4?'score-high':r.comm_score===3?'score-mid':'score-low'}">${r.comm_score}/5</span>`)}
    ${mrow('Interests',tags(r.interests))}
    ${mrow('Wants AI feed?',escHtml(r.ai_reco))}
    ${mrow('Notif. channels',tags(r.notif))}
    ${mrow('Notif. frequency',escHtml(r.notif_freq))}
    ${mrow('Wanted features',tags(r.features))}
    ${mrow('Privacy comfort',escHtml(r.privacy))}
    ${mrow('Likely to use',`<span class="score-pill ${r.likely_score>=4?'score-high':r.likely_score===3?'score-mid':'score-low'}">${r.likely_score}/5</span>`)}
    ${mrow('Biggest problem',`<div style="line-height:1.7;white-space:pre-wrap">${escHtml(r.biggest_problem)}</div>`)}
    ${r.wishlist?mrow('Dream feature',`<div style="line-height:1.7;white-space:pre-wrap">${escHtml(r.wishlist)}</div>`):''}
    ${r.other?mrow('Other feedback',`<div style="line-height:1.7;white-space:pre-wrap">${escHtml(r.other)}</div>`):''}
  `;
  document.getElementById('modalOverlay').classList.add('open');
}

function mrow(k,v){ return `<div class="modal-row"><div class="modal-key">${k}</div><div class="modal-val">${v}</div></div>`; }
function closeModal(e){ if (!e||e.target===document.getElementById('modalOverlay')) document.getElementById('modalOverlay').classList.remove('open'); }

async function deleteResponse(id) {
  if (!confirm(`Delete response #${id}? This cannot be undone.`)) return;
  try {
    await api(`/api/dashboard/responses/${id}`,{method:'DELETE'});
    showToast(`Response #${id} deleted`,'success');
    await Promise.all([loadStats(),loadResponses(currentPage)]);
  } catch(e) { showToast('Delete failed: '+e.message,'error'); }
}

async function exportCSV() {
  try {
    const res = await api('/api/dashboard/export');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download='campusconnect_responses.csv'; a.click();
    URL.revokeObjectURL(url);
    showToast('CSV downloaded!','success');
  } catch(e) { showToast('Export failed: '+e.message,'error'); }
}

function escHtml(str){ if(!str)return''; return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

let toastTimer;
function showToast(msg,type='success'){ const t=document.getElementById('toast'); t.textContent=msg; t.className=`toast ${type} show`; clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),3500); }

setInterval(()=>{ if(TOKEN) loadStats(); }, 60000);
</script>
</body>
</html>
